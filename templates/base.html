<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Morning Interchange Report Generator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Morning Interchange Report Generator</h1>
    </header>

    {% block step_indicator %}{% endblock %}

    <main>
        <div class="container">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="messages">
                        {% for message in messages %}
                            <div class="message">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        // Stop the server when this tab is closed.
        fetch('/hello', {method: 'POST'}).catch(function () {});
        window.addEventListener('pagehide', function () {
            navigator.sendBeacon('/closing');
        });
    </script>
</body>
</html>
